[workspace]
members = ["crates/core", "crates/cli", "crates/app"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipperino-core = { path = "crates/core" }

# GPUI, image handling, and frame copies are far too slow unoptimized; keep our own
# crates quick to rebuild but always optimize dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
